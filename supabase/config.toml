project_id = "kilo-gym"
[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000
[db]
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/reset-password"]
enable_signup = false
[auth.email]
enabled = true
enable_confirmations = true
[studio]
enabled = true
[local_smtp]
enabled = true

[experimental]
stack = true

[auth.email.template.invite]
subject = "KILO 工作台邀請"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "KILO 密碼重設"
content_path = "./supabase/templates/recovery.html"
